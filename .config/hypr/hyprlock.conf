# hyprlock.conf — lock screen, Rosé Pine
# (hyprlock has its own config format; the Lua config only applies to Hyprland)

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(191724ff)        # base
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(c4a7e7ff)  # iris
    inner_color = rgba(1f1d2eff)  # surface
    font_color = rgba(e0def4ff)   # text
    check_color = rgba(f6c177ff)  # gold
    fail_color = rgba(eb6f92ff)   # love
    placeholder_text = <i>password…</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(e0def4ff)        # text
    font_size = 72
    position = 0, 80
    halign = center
    valign = center
}
