# hypridle.conf — idle management (hypridle has its own config format;
# the Lua config only applies to Hyprland itself)
#
# IMPORTANT: with the Lua config, `hyprctl dispatch` parses its argument as a
# Lua EXPRESSION. Classic syntax like `hyprctl dispatch dpms on` breaks, and
# `hl.dsp.dpms("on")` silently means TOGGLE (the argument must be a table).
# The correct form is:  hl.dsp.dpms({ action = "on" })

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off ~1.5 min after locking
listener {
    timeout = 390
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

